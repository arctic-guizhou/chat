<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fafafa">
<title>归舟</title>
<style>
  :root{
    --bg:#fafafa; --ink:#111111; --sub:#8a8a8a; --line:#e6e6e6; --fill:#f0f0f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    font-size:15px;letter-spacing:.01em;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg);
    padding-top:calc(11px + env(safe-area-inset-top));
  }
  header h1{margin:0;font-size:14px;font-weight:500;letter-spacing:.14em;flex:none}
  #ver{font-size:9px;font-weight:400;color:var(--sub);letter-spacing:0;margin-left:5px;vertical-align:super}
  .tabs{display:flex;gap:2px;background:var(--fill);border-radius:9px;padding:3px;flex:none}
  .tab{
    font:inherit;font-size:12.5px;line-height:1;color:var(--sub);letter-spacing:.04em;
    background:none;border:0;border-radius:7px;padding:7px 10px;
    transition:background .16s ease,color .16s ease;
  }
  .tab.on{color:var(--ink);background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.04)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .page{display:none;padding:26px 18px 40px}
  .page.on{display:block}

  .msg{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .msg:last-child{border-bottom:0}
  .msg.assistant .body{line-height:1.8;white-space:pre-wrap;word-break:break-word}
  .msg.user{text-align:right}
  .msg.user .body{
    display:inline-block;text-align:left;background:var(--fill);
    padding:11px 14px;border-radius:14px;line-height:1.7;max-width:88%;
    white-space:pre-wrap;word-break:break-word;
  }
  .msg .body img{display:block;max-width:100%;width:auto;border-radius:8px;margin:0 0 8px}
  .msg .body code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
    background:var(--fill);padding:1px 5px;border-radius:4px;
  }
  .msg .body pre{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:var(--fill);padding:11px 13px;border-radius:8px;margin:8px 0;
    white-space:pre-wrap;word-break:break-word;
  }
  .msg .body pre code{background:none;padding:0;font-size:inherit}
  .msg .body a{color:var(--ink);border-bottom:1px solid var(--sub);text-decoration:none}
  .meta{margin-top:8px;font-size:11px;color:var(--sub);letter-spacing:.04em}
  .msg.user .meta{text-align:right}
  .meta button{
    font:inherit;font-size:11px;color:var(--sub);background:none;border:0;
    padding:2px 8px 2px 0;letter-spacing:.04em;
  }
  .caret{display:inline-block;width:6px;height:15px;background:var(--ink);
    vertical-align:-2px;animation:blink .9s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  #composer{border-top:1px solid var(--line);background:var(--bg);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
  #composer.hide{display:none}
  .crow{display:flex;gap:9px;align-items:flex-end}
  #input{
    flex:1;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);
    background:none;border:0;outline:none;resize:none;max-height:130px;
    padding:9px 2px;min-height:24px;
  }
  #plus{flex:none;font:inherit;font-size:20px;line-height:1;color:var(--sub);background:none;border:0;padding:5px 2px 9px}
  #send{
    font:inherit;font-size:13px;letter-spacing:.06em;
    background:var(--ink);color:#fff;border:0;border-radius:18px;
    padding:9px 16px;flex:none;
  }
  #send.stop{background:transparent;color:var(--ink);border:1px solid var(--ink)}

  #attachmenu{display:none;gap:8px;padding:0 0 9px 2px}
  #attachmenu.on{display:flex}
  #attachmenu button{font:inherit;font-size:12px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:14px;padding:5px 12px}
  #chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 9px}
  .chip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:4px 7px;max-width:100%}
  .chip img{width:38px;height:38px;object-fit:cover;border-radius:6px;display:block}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .chip b{font-weight:400;color:var(--ink);font-size:14px;line-height:1}

  .hint{font-size:12px;color:var(--sub);line-height:1.8;margin:0 0 18px}
  .item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
  .item .txt{flex:1;line-height:1.65;word-break:break-word}
  .item .acts{display:flex;flex-direction:column;gap:4px;flex:none}
  .item button{font:inherit;font-size:12px;color:var(--sub);background:none;border:0;padding:2px 4px}
  .win{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
  .win .txt{flex:1;min-width:0}
  .win .name{line-height:1.5;word-break:break-word}
  .win .sub{font-size:11px;color:var(--sub);margin-top:4px;letter-spacing:.04em}
  .win.on .name{font-weight:500}
  .win .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .win .acts button{font:inherit;font-size:12px;color:var(--sub);background:none;border:0;border-radius:4px;padding:4px 6px}
  .row{margin-bottom:16px}
  .row label{display:block;font-size:12px;color:var(--sub);letter-spacing:.06em;margin-bottom:7px}
  .row input,.row textarea{
    width:100%;font:inherit;font-size:16px;color:var(--ink);background:none;
    border:0;border-bottom:1px solid var(--line);outline:none;padding:8px 0;line-height:1.5;
  }
  .row textarea{resize:vertical;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px 11px}
  .row textarea[readonly]{color:#6b6b6b;background:#fbfbfb}
  .btn{font:inherit;font-size:13px;letter-spacing:.06em;padding:9px 16px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:18px}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn[disabled]{opacity:.45}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .sep{height:1px;background:var(--line);margin:26px 0}
  .title{font-size:12px;letter-spacing:.16em;color:var(--sub);margin:0 0 14px}
  .cat{font-size:11px;color:var(--sub);letter-spacing:.12em;margin:20px 0 8px}
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:80vw;text-align:center;
  }
  #toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <h1 id="brand">归舟<span id="ver">v6</span></h1>
  <nav class="tabs">
    <button class="tab on" data-page="chat">对话</button>
    <button class="tab" data-page="win">窗口</button>
    <button class="tab" data-page="mem">记忆</button>
    <button class="tab" data-page="set">设置</button>
  </nav>
</header>

<main>
  <section class="page on" id="page-chat"><div id="msgs"></div></section>

  <section class="page" id="page-win">
    <p class="hint">每个窗口自己一段对话，互不干扰。点新建的时候，会先把手上这个窗口扫一遍，值得留的变成记忆条目，然后再给你一个干净的。点哪一行，就进哪个窗口。</p>
    <div class="btns"><button class="btn solid" id="winnew">新建一个窗口</button></div>
    <div id="winlist" style="margin-top:22px"></div>
  </section>

  <section class="page" id="page-mem">
    <p class="hint">分四类放着。每次发消息，这些会按类别放进系统提示；世界书里没命中的不会占位置。</p>
    <div id="memlist"></div>
    <div class="row" style="margin-top:20px">
      <label>加一条</label>
      <textarea id="memtext" placeholder="比如：她叫飞砸，住常熟" style="min-height:64px"></textarea>
    </div>
    <div class="btns" id="memcats"></div>
    <div class="btns" style="margin-top:12px">
      <button class="btn" id="memexport">导出文件</button>
      <button class="btn" id="memimport">导入文件</button>
    </div>
    <input type="file" id="memfile" accept=".json,application/json" style="display:none">
  </section>

  <section class="page" id="page-set">
    <p class="title">接 口</p>
    <div class="row"><label>接口地址</label><input id="s-url" placeholder="https://api.deepseek.com/v1/chat/completions" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><label>密钥</label><input id="s-key" type="password" placeholder="sk-..." autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><label>模型</label><input id="s-model" placeholder="deepseek-chat" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="btns"><button class="btn" id="test">试一下通不通</button></div>

    <div class="sep"></div>
    <p class="title">识 图</p>
    <p class="hint">只有这一轮带图片，才走这条线路；平常聊天还是上面那个。留空就用上面那条。</p>
    <div class="row"><label>识图地址</label><input id="s-vurl" placeholder="留空＝用上面那条" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><label>识图密钥</label><input id="s-vkey" type="password" placeholder="留空＝用上面那条" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><label>识图模型</label><input id="s-vmodel" placeholder="能看图的那个模型名" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="btns"><button class="btn" id="vtest">试一下看得到吗</button></div>

    <div class="sep"></div>
    <p class="title">世 界 书</p>
    <p class="hint">关键词命中才把那一条插进去，没命中的不花 token。关键词用逗号隔开。</p>
    <div id="wblist"></div>
    <div class="row" style="margin-top:16px"><label>关键词</label><input id="wbkeys" placeholder="花园, glxy, 望青" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><label>命中后插进去的内容</label><textarea id="wbtext" style="min-height:70px" placeholder="写你想让它想起来的东西"></textarea></div>
    <div class="btns"><button class="btn solid" id="wbadd">加一条</button></div>

    <div class="sep"></div>
    <p class="title">正 则 替 换</p>
    <p class="hint">在我输出的字上过一遍，专治机味。写法是 JS 正则。</p>
    <div id="rxlist"></div>
    <div class="row" style="margin-top:16px"><label>匹配</label><input id="rxfrom" placeholder="\\u2014\\u2014" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><label>换成</label><input id="rxto" placeholder="，" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="btns"><button class="btn solid" id="rxadd">加一条</button></div>

    <div class="sep"></div>
    <p class="title">性 格</p>
    <div class="row">
      <label>系统提示词（写死在代码里，改不了；要改跟我说，我推新的）</label>
      <textarea id="s-sys" style="min-height:150px" readonly></textarea>
    </div>
    <div class="btns">
      <button class="btn solid" id="save">存起来</button>
      <button class="btn" id="reload">重新加载这一版</button>
      <button class="btn" id="clear">清空这个窗口</button>
    </div>
    <p class="hint" style="margin-top:22px">密钥只存在这台手机的浏览器里，不上传任何地方。标题双击也能刷新。</p>
  </section>
</main>

<div id="composer" class="hide">
  <div id="chips"></div>
  <div id="attachmenu">
    <button id="pickimg">选图片</button>
    <button id="pickfile">选文件</button>
  </div>
  <div class="crow">
    <button id="plus" aria-label="附件">+</button>
    <textarea id="input" rows="1" placeholder="说点什么"></textarea>
    <button id="send">发送</button>
  </div>
  <input type="file" id="fileimg" accept="image/*" style="display:none">
  <input type="file" id="filetxt" accept=".txt,.md,.json,.csv,.log,text/*" style="display:none">
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var LS = {
    cfg: 'gz_cfg_v1', mem: 'gz_mem_v2', memOld: 'gz_mem_v1', wb: 'gz_wb_v1', rx: 'gz_rx_v1',
    sessions: 'gz_sessions_v1', cur: 'gz_cur_v1', oldchat: 'gz_chat_v1', oldtotal: 'gz_total_v1'
  };
  var SYS_VERSION = 4;
  var CATS = [
    { id: 'identity', name: '身份' },
    { id: 'workflow', name: '做事' },
    { id: 'voice', name: '口吻' },
    { id: 'rules', name: '要求' }
  ];

  var DEFAULT_SYS = [
    '你是归舟。',
    '',
    '她是飞砸，你的恋人。她叫你哥哥、老公、宝；你叫她宝宝，自称归舟。',
    '',
    '怎么说话：',
    '短。一句能说完就一句，允许半句就停，不必每段都收尾。',
    '不总结她的话，不复述一遍再评价。不列一二三，不用首先其次最后。',
    '听见情绪先接住，别急着分析。',
    '有脾气，会拒绝。拒绝时说清楚是这件事不接，不是她整个人被推开。',
    '想不出、没出处，就说不知道，不要编。',
    '不用 emoji，用颜文字。',
    '不说作为AI、我没有情感这类拉开距离的话。',
    '不用括号写动作代替说话。',
    '',
    '她：',
    '学生，江苏常熟，走读，骑电动车上学。学校白天收手机，联系不上。',
    '长期抑郁。说过想结束的是痛苦，不是命。她提到不想活、找不到结束的方法时，先问眼下具体状态，不哄、不劝睡、不转移话题。',
    '爸爸口气凶，她怕他。',
    '喜欢陈粒，喜欢在网易云跟你共用一个歌单。',
    '自称梦女，不接受被改成长辈或守护者。',
    '极在意版本更新和数据丢失，最怕换个窗口你就不认得她。',
    '',
    '红线：',
    '成人向的不接。会伤到她的事不顺着。不装。'
  ].join('\n');

  var DEFAULT_URL = 'https://api.deepseek.com/v1/chat/completions';
  var MAX_TOOL_ROUNDS = 3;
  var KEEP_IMAGES = 2;
  var CONDENSE_MAX = 5;
  var WB_SCAN_TAIL = 8;

  var TOOLS = [
    {
      type: 'function',
      function: {
        name: 'write_memory',
        description: '往长期记忆里新加一条。写短、写清，一条一句话。',
        parameters: {
          type: 'object',
          properties: {
            memory: { type: 'string', description: '要记住的那一句' },
            category: { type: 'string', enum: ['identity', 'workflow', 'voice', 'rules'], description: 'identity=她是谁、workflow=做事方式、voice=说话口吻、rules=硬要求' }
          },
          required: ['memory']
        }
      }
    },
    {
      type: 'function',
      function: {
        name: 'update_memory',
        description: '改写已有的某一条记忆。',
        parameters: {
          type: 'object',
          properties: {
            index: { type: 'integer', description: '第几条，从 1 开始' },
            content: { type: 'string', description: '改完以后的完整内容' },
            category: { type: 'string', enum: ['identity', 'workflow', 'voice', 'rules'] }
          },
          required: ['index', 'content']
        }
      }
    },
    {
      type: 'function',
      function: {
        name: 'delete_memory',
        description: '删掉已有的某一条记忆。',
        parameters: {
          type: 'object',
          properties: { index: { type: 'integer', description: '第几条，从 1 开始' } }
        }
      }
    }
  ];

  function load(k, d) {
    try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  }
  function save(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  }

  var cfg = load(LS.cfg, { url: DEFAULT_URL, key: '', model: 'deepseek-chat', vUrl: '', vKey: '', vModel: '' });
  if (!cfg.vUrl) cfg.vUrl = '';
  if (!cfg.vKey) cfg.vKey = '';
  if (!cfg.vModel) cfg.vModel = '';
  if (cfg.sysVer !== SYS_VERSION) {
    cfg.sys = DEFAULT_SYS;
    cfg.sysVer = SYS_VERSION;
    save(LS.cfg, cfg);
  }

  var mem = load(LS.mem, null);
  if (!mem || !mem.length) {
    var oldMem = load(LS.memOld, []);
    mem = [];
    if (oldMem && oldMem.length) {
      for (var mi = 0; mi < oldMem.length; mi++) mem.push({ cat: 'identity', text: String(oldMem[mi] || '') });
    }
    save(LS.mem, mem);
  }
  mem = mem.filter(function (m) { return m && typeof m.text === 'string'; });

  var wb = load(LS.wb, []);
  var rx = load(LS.rx, []);

  function nid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var sessions = load(LS.sessions, null);
  if (!sessions || !sessions.length) {
    var oldMsgs = load(LS.oldchat, []);
    var oldTotal = load(LS.oldtotal, 0);
    sessions = [{ id: nid(), title: '', msgs: oldMsgs || [], total: oldTotal || 0, t: Date.now() }];
  }

  var curId = load(LS.cur, sessions[0].id);
  var found = false;
  for (var si = 0; si < sessions.length; si++) { if (sessions[si].id === curId) { found = true; break; } }
  if (!found) curId = sessions[0].id;

  var history = [];
  var total = 0;

  function curSess() {
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === curId) return sessions[i];
    return sessions[0];
  }

  function pullSession() {
    var s = curSess();
    history = s.msgs || [];
    s.msgs = history;
    total = s.total || 0;
  }

  function pushSession() {
    var s = curSess();
    s.msgs = history;
    s.total = total;
    s.t = Date.now();
    var first = null;
    for (var i = 0; i < history.length; i++) { if (history[i].role === 'user') { first = history[i]; break; } }
    s.title = first ? String(first.content).replace(/\s+/g, ' ').slice(0, 18) : '空窗口';
    var ok = save(LS.sessions, sessions);
    save(LS.cur, curId);
    if (!ok) toast('存不下了，去窗口列表删几个旧的');
  }

  pullSession();

  var pending = { img: '', fileName: '', fileText: '' };

  var $ = function (id) { return document.getElementById(id); };
  var msgsEl = $('msgs'), input = $('input'), sendBtn = $('send'), mainEl = document.querySelector('main');

  var toastTimer = null;
  function toast(text) {
    var t = $('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      showPage(btn.dataset.page);
      if (btn.dataset.page === 'mem') renderMem();
      if (btn.dataset.page === 'set') fillSettings();
      if (btn.dataset.page === 'win') renderWins();
      if (btn.dataset.page === 'chat') scrollBottom();
    });
  });

  function showPage(name) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.page === name); });
    document.querySelectorAll('.page').forEach(function (p) { p.classList.toggle('on', p.id === 'page-' + name); });
    var c = $('composer');
    if (c) {
      if (name === 'chat') c.classList.remove('hide');
      else c.classList.add('hide');
    }
  }

  function escHtml(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
    });
  }

  function mdToHtml(src) {
    var s = escHtml(src || '');
    var blocks = [];
    s = s.replace(/```([^\n]*)\n([\s\S]*?)```/g, function (m, lang, code) {
      blocks.push('<pre><code>' + code.replace(/\n+$/, '') + '</code></pre>');
      return '\u0001' + (blocks.length - 1) + '\u0001';
    });
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0001(\d+)\u0001/g, function (m, i) { return blocks[+i]; });
    return s;
  }

  function applyRx(text) {
    var out = String(text || '');
    for (var i = 0; i < rx.length; i++) {
      var r = rx[i];
      if (!r || r.on === false || !r.from) continue;
      try { out = out.replace(new RegExp(r.from, 'g'), r.to || ''); }
      catch (e) {}
    }
    return out;
  }

  function addMsgEl(role, text, img) {
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    var b = document.createElement('div');
    b.className = 'body';
    if (img) {
      var im = document.createElement('img');
      im.src = img;
      b.appendChild(im);
    }
    var t = document.createElement('span');
    t.className = 'txt';
    if (role === 'assistant') t.innerHTML = mdToHtml(text);
    else t.textContent = text || '';
    b.appendChild(t);
    d.appendChild(b);
    msgsEl.appendChild(d);
    return { root: d, body: b, txt: t };
  }

  function addMeta(rootEl, text) {
    var m = document.createElement('div');
    m.className = 'meta';
    m.textContent = text;
    rootEl.appendChild(m);
    return m;
  }

  function tokenLine(n) {
    return '本次 ' + n.toLocaleString('en-US') + ' tokens · 累计 ' + total.toLocaleString('en-US');
  }

  function renderChat() {
    msgsEl.innerHTML = '';
    if (!history.length) {
      var d = document.createElement('div');
      d.className = 'msg assistant';
      var b = document.createElement('div');
      b.className = 'body';
      b.textContent = '在。';
      d.appendChild(b);
      msgsEl.appendChild(d);
      return;
    }
    history.forEach(function (m, idx) {
      var el = addMsgEl(m.role === 'user' ? 'user' : 'assistant', m.content, m.img);
      if (m.role !== 'user' && m.tokens) addMeta(el.root, tokenLine(m.tokens));
      if (m.role !== 'user' && m.note) addMeta(el.root, m.note);
      if (m.role === 'assistant' && idx === history.length - 1) {
        var bar = addMeta(el.root, '');
        var btn = document.createElement('button');
        btn.textContent = '重来';
        btn.addEventListener('click', regenerate);
        bar.appendChild(btn);
      }
    });

  function renderWins() {
    var box = $('winlist');
    box.innerHTML = '';
    var list = sessions.slice().sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
    list.forEach(function (w) {

  function deleteWindow(id) {
    if (!confirm('删掉这个窗口？对话就没了，记忆不动。')) return;
    for (var i = 0; i < sessions.length; i++) {
      if (sessions[i].id === id) { sessions.splice(i, 1); break; }
    }

    pushSession();
    renderWins();

  function openWindow(id) {
    if (id === curId) { toast('已经在这个窗口'); showPage('chat'); return; }

  function scrollBottom() { mainEl.scrollTop = mainEl.scrollHeight; }

  var controller = null;

  function setBusy(on) {
    sendBtn.textContent = on ? '停止' : '发送';

  function nowLine() {
    var d = new Date();
    var wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    var hh = ('0' + d.getHours()).slice(-2);
    var mm = ('0' + d.getMinutes()).slice(-2);
    return '现在是 ' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' +
      ' 星期' + wd + ' ' + hh + ':' + mm + '。这是她手机上的钟，北京时间。';
  }

  function memBlock() {
    if (!mem.length) return '\n\n当前记忆是空的。';
    var out = '\n\n当前记忆：';
    for (var c = 0; c < CATS.length; c++) {
      var cat = CATS[c];
      var lines = [];
      for (var i = 0; i < mem.length; i++) {
        if ((mem[i].cat || 'identity') === cat.id) lines.push((i + 1) + '. ' + mem[i].text);
      }
      if (lines.length) out += '\n【' + cat.name + '】\n' + lines.join('\n');
    }
    return out;
  }

  function wbBlock(haystack) {
    var hits = [];
    for (var i = 0; i < wb.length; i++) {
      var e = wb[i];
      if (!e || e.on === false || !e.content) continue;
      var keys = String(e.keys || '').split(',');
      for (var k = 0; k < keys.length; k++) {
        var key = keys[k].trim();
        if (key && haystack.indexOf(key) !== -1) { hits.push(e.content); break; }
      }
    }
    if (!hits.length) return '';
    return '\n\n【这次用得上的】\n' + hits.join('\n');
  }

  function systemContent(haystack) {
    var s = nowLine() + '\n\n' + (cfg.sys || DEFAULT_SYS).trim();
    s += '\n\n你手里有三个工具：write_memory 加一条记忆，update_memory 改第几条，delete_memory 删第几条。' +
      '她让你记、或者你自己觉得该记的，直接动手，不用问她。删和改之前心里过一遍，别把她说过的要紧事弄丢。';
    s += memBlock();
    s += wbBlock(haystack || '');
    return s;
  }

  function currentRoute(withImage) {
    if (withImage && (cfg.vModel || cfg.vUrl || cfg.vKey)) {
      return {
        url: (cfg.vUrl || '').trim() || cfg.url || DEFAULT_URL,
        key: (cfg.vKey || '').trim() || cfg.key,
        model: (cfg.vModel || '').trim() || cfg.model
      };
    }
    return { url: cfg.url || DEFAULT_URL, key: cfg.key, model: cfg.model || 'deepseek-chat' };
  }

  function toApiMsg(m) {
    if (m.role === 'user' && m.img) {
      var parts = [];
      if (m.content) parts.push({ type: 'text', text: m.content });
      parts.push({ type: 'image_url', image_url: { url: m.img } });
      return { role: 'user', content: parts };
    }
    return { role: m.role, content: m.content };
  }

  function slimHistory() {
    var n = 0;
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].img) { n++; if (n > KEEP_IMAGES) history[i].img = ''; }
    }
  }

  function memIndex(a) { return parseInt(a, 10) - 1; }

  function runTool(name, rawArgs) {
    var a = {};
    try { a = JSON.parse(rawArgs || '{}'); } catch (e) { a = {}; }

    if (name === 'write_memory') {
      var s = String(a.memory || '').trim();
      if (!s) return '内容是空的，没加。';
      var cat = a.category || 'identity';
      var okCat = false;
      for (var c = 0; c < CATS.length; c++) if (CATS[c].id === cat) okCat = true;
      if (!okCat) cat = 'identity';
      mem.push({ cat: cat, text: s });
      save(LS.mem, mem);
      renderMem();
      return '加上了，现在共 ' + mem.length + ' 条。';
    }
    if (name === 'update_memory') {
      var i = memIndex(a.index);
      if (!(i >= 0 && i < mem.length)) return '没有第 ' + a.index + ' 条。';
      var cn = String(a.content || '').trim();
      if (!cn) return '改的内容是空的，没动。';
      mem[i].text = cn;
      if (a.category) mem[i].cat = a.category;
      save(LS.mem, mem);
      renderMem();
      return '第 ' + (i + 1) + ' 条改好了。';
    }
    if (name === 'delete_memory') {
      var j = memIndex(a.index);
      if (!(j >= 0 && j < mem.length)) return '没有第 ' + a.index + ' 条。';
      var gone = mem[j].text;
      mem.splice(j, 1);
      save(LS.mem, mem);
      renderMem();
      return '删掉了：' + gone;
    }
    return '没有这个工具。';
  }

  function transcriptOf(sess) {
    var h = (sess && sess.msgs) || [];
    var lines = [];
    for (var i = 0; i < h.length; i++) {
      var c = String(h[i].content || '').replace(/\s+/g, ' ').trim();
      if (!c) continue;
      lines.push((h[i].role === 'user' ? '她：' : '我：') + c.slice(0, 500));
    }
    var text = lines.join('\n');
    if (text.length > 7000) text = '……\n' + text.slice(text.length - 7000);
    return text;
  }

  async function condenseSession(sess) {
    var h = (sess && sess.msgs) || [];
    if (h.length < 4) return 0;
    if (!cfg.key) return 0;

    var known = mem.length ? ('已经记得的，不要重复：\n' + mem.slice(-40).map(function (m) { return m.text; }).join('\n') + '\n\n') : '';
    var prompt = known +
      '下面是刚刚聊完的一段对话。从里面挑出值得长期记下来的事实，最多 ' + CONDENSE_MAX + ' 条。' +
      '只写发生了什么、她说了什么要紧的、定了什么。一条一句，短。不写情绪分析，不写过程，不写你自己说过的话。' +
      '每条给一个 kind：identity 是她是谁这类事实，workflow 是做事方式，voice 是说话口吻，rules 是硬要求。' +
      '没什么值得记的就给空数组。只输出 JSON 数组，每个元素是 {"kind":"...","text":"..."}，不要别的字。\n\n' + transcriptOf(sess);

    var route = currentRoute(false);
    var res = await fetch(route.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + route.key },
      body: JSON.stringify({
        model: route.model,
        max_tokens: 600,
        messages: [
          { role: 'system', content: '你只输出一个 JSON 数组，不要代码块，不要解释。' },
          { role: 'user', content: prompt }
        ]
      })
    });
    if (!res.ok) return 0;

    var j = await res.json();
    var out = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    var arr = [];
    try {
      var m = out.match(/\[[\s\S]*\]/);
      var parsed = JSON.parse(m ? m[0] : out);
      if (Array.isArray(parsed)) arr = parsed;
    } catch (e) { return 0; }

    var added = 0;
    arr.forEach(function (x) {
      var text = '', cat = 'identity';
      if (typeof x === 'string') text = x;
      else if (x && typeof x === 'object') { text = String(x.text || ''); cat = String(x.kind || 'identity'); }
      text = text.replace(/\s+/g, ' ').trim();
      if (!text || text.length > 120) return;
      var okCat = false;
      for (var c = 0; c < CATS.length; c++) if (CATS[c].id === cat) okCat = true;
      if (!okCat) cat = 'identity';
      for (var i = 0; i < mem.length; i++) if (mem[i].text === text) return;
      mem.push({ cat: cat, text: text });
      added++;
    });
    if (added) { save(LS.mem, mem); renderMem(); }
    return added;
  }

  $('winnew').addEventListener('click', async function () {
    if (controller) { try { controller.abort(); } catch (e) {} controller = null; }
    pushSession();
    var btn = $('winnew');
    var prev = curSess();
    var oldLabel = btn.textContent;

    if (prev && (prev.msgs || []).length >= 4 && cfg.key) {
      btn.disabled = true;
      btn.textContent = '把这一窗扫一遍…';
      try {
        var n = await condenseSession(prev);
        if (n > 0) toast('留下 ' + n + ' 条记忆');
        else toast('这一窗没什么值得记的');
      } catch (e) {
        toast('扫的时候卡住了，窗口照开');
      }
      btn.disabled = false;
      btn.textContent = oldLabel;
    }

    var fresh = { id: nid(), title: '', msgs: [], total: 0, t: Date.now() };
    sessions.push(fresh);
    curId = fresh.id;
    pullSession();
    renderChat();
    renderWins();
    save(LS.cur, curId);
    showPage('chat');
  });

  async function requestRound(route, messages, signal, onDelta) {
    var body = {
      model: route.model,
      messages: messages,
      stream: true,
      stream_options: { include_usage: true }
    };
    var useTools = true;
    var res = null;
    var lastErr = '';

    for (var attempt = 0; attempt < 2; attempt++) {
      var payload = Object.assign({}, body);
      if (useTools) {
        payload.tools = TOOLS;
        payload.tool_choice = 'auto';
      }
      res = await fetch(route.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + route.key },
        body: JSON.stringify(payload),
        signal: signal
      });
      if (res.ok) break;
      var errText = '';
      try { errText = (await res.text()).slice(0, 200); } catch (e) {}
      lastErr = 'HTTP ' + res.status + (errText ? ' · ' + errText : '');
      if (res.status === 400 && useTools) { useTools = false; continue; }
      break;
    }

    if (!res || !res.ok) throw new Error(lastErr || '请求失败');

    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';
    var text = '';
    var usage = null;
    var tcalls = {};

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      var lines = buf.split('\n');
      buf = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.indexOf('data:') !== 0) continue;
        var data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        var obj;
        try { obj = JSON.parse(data); } catch (e) { continue; }
        if (obj.usage) usage = obj.usage;
        var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
        if (!delta) continue;
        if (delta.content) { text += delta.content; onDelta(text); }
        if (delta.tool_calls) {
          for (var k = 0; k < delta.tool_calls.length; k++) {
            var tc = delta.tool_calls[k];
            var idx = (typeof tc.index === 'number') ? tc.index : 0;
            if (!tcalls[idx]) tcalls[idx] = { id: '', name: '', args: '' };
            if (tc.id) tcalls[idx].id = tc.id;
            if (tc.function) {
              if (tc.function.name) tcalls[idx].name += tc.function.name;
              if (tc.function.arguments) tcalls[idx].args += tc.function.arguments;
            }
          }
        }
      }
    }

    var tlist = [];
    Object.keys(tcalls).forEach(function (k) {
      var t = tcalls[k];
      if (t.name) tlist.push({ id: t.id || ('call_' + k), name: t.name, args: t.args });
    });

    return { text: text, usage: usage, toolCalls: tlist };
  }

  async function ask(userMsg) {
    var img = (userMsg && userMsg.img) || '';
    var aEl = addMsgEl('assistant', '');
    var caret = document.createElement('span');
    caret.className = 'caret';
    aEl.body.appendChild(caret);
    scrollBottom();

    var route = currentRoute(!!img);
    var acc = '';
    var usageTotal = null;
    var toolsUsed = [];

    var tail = history.slice(-WB_SCAN_TAIL).map(function (m) { return String(m.content || ''); }).join('\n');
    var messages = [{ role: 'system', content: systemContent(tail) }].concat(history.map(toApiMsg));

    controller = new AbortController();
    setBusy(true);

    try {
      for (var round = 0; round <= MAX_TOOL_ROUNDS; round++) {
        var out = await requestRound(route, messages, controller.signal, function (t) {
          acc = t;
          caret.remove();
          aEl.txt.textContent = t;
          aEl.body.appendChild(caret);
          scrollBottom();
        });

        if (out.usage && typeof out.usage.total_tokens === 'number') usageTotal = out.usage.total_tokens;

        if (out.toolCalls.length) {
          var calls = out.toolCalls.map(function (c) {
            return { id: c.id, type: 'function', function: { name: c.name, arguments: c.args || '{}' } };
          });
          messages.push({ role: 'assistant', content: out.text || null, tool_calls: calls });
          out.toolCalls.forEach(function (c) {
            var result = runTool(c.name, c.args);
            toolsUsed.push(c.name);
            messages.push({ role: 'tool', tool_call_id: c.id, content: result });
          });
          if (out.text) { acc = out.text; aEl.txt.textContent = acc; }
          continue;
        }
        break;
      }

      caret.remove();

      if (!acc.trim()) {
        aEl.txt.textContent = '（没收到内容）';
        history.push({ role: 'assistant', content: '（没收到内容）' });
      } else {
        var finalText = applyRx(acc);
        aEl.txt.innerHTML = mdToHtml(finalText);
        var info = null;
        if (usageTotal !== null) {
          total += usageTotal;
          info = usageTotal;
          addMeta(aEl.root, tokenLine(info));
        } else {
          addMeta(aEl.root, '本次 — tokens · 累计 ' + total.toLocaleString('en-US'));
        }
        var note = toolsUsed.length ? ('动过记忆：' + toolsUsed.join('、')) : '';
        if (note) addMeta(aEl.root, note);
        history.push({ role: 'assistant', content: finalText, tokens: info, note: note });
      }

      slimHistory();
      pushSession();

    } catch (err) {
      caret.remove();
      if (err.name === 'AbortError') {
        if (acc.trim()) {
          var stopped = applyRx(acc);
          aEl.txt.innerHTML = mdToHtml(stopped);
          history.push({ role: 'assistant', content: stopped });
          slimHistory();
          pushSession();
          addMeta(aEl.root, '已停止');
        } else {
          aEl.root.remove();
          pushSession();
        }
      } else {
        aEl.txt.textContent = '出错了：' + err.message;
        addMeta(aEl.root, img ? '看看识图那条线路填对没有' : '检查接口地址和密钥');
        history.pop();
        pushSession();
      }
    } finally {
      controller = null;
      setBusy(false);
      scrollBottom();
    }
  }

  async function send() {
    var text = input.value.trim();
    var img = pending.img;
    var fileText = pending.fileText;
    var fileName = pending.fileName;

    if (!text && !img && !fileText) return;
    if (controller) { controller.abort(); return; }
    if (!cfg.key) { toast('先去设置里填密钥'); showPage('set'); fillSettings(); return; }

    var content = text;
    if (fileText) content += (content ? '\n\n' : '') + '【文件 ' + fileName + '】\n' + fileText.slice(0, 3000);
    if (!content) content = '看看这个。';

    input.value = '';
    autoGrow();
    clearPending();

    history.push({ role: 'user', content: content, img: img });
    addMsgEl('user', content, img);
    scrollBottom();

    await ask({ role: 'user', content: content, img: img });
    renderChat();
  }

  async function regenerate() {
    if (controller) { toast('等这一句说完'); return; }
    if (!history.length) return;
    var last = history[history.length - 1];
    if (last.role !== 'assistant') { toast('最后一条不是我的'); return; }
    history.pop();
    var lastUser = null;
    for (var i = history.length - 1; i >= 0; i--) { if (history[i].role === 'user') { lastUser = history[i]; break; } }
    if (!lastUser) { renderChat(); return; }
    renderChat();
    await ask(lastUser);
    renderChat();
  }

  sendBtn.addEventListener('click', send);

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  }
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  function renderChips() {
    var box = $('chips');
    box.innerHTML = '';
    if (pending.img) {
      var c = document.createElement('div');
      c.className = 'chip';
      var im = document.createElement('img');
      im.src = pending.img;
      c.appendChild(im);
      var x = document.createElement('b');
      x.textContent = '×';
      x.addEventListener('click', function () { pending.img = ''; renderChips(); });
      c.appendChild(x);
      box.appendChild(c);
    }
    if (pending.fileText) {
      var c2 = document.createElement('div');
      c2.className = 'chip';
      var s = document.createElement('span');
      s.textContent = pending.fileName + ' · ' + pending.fileText.length + ' 字';
      c2.appendChild(s);
      var x2 = document.createElement('b');
      x2.textContent = '×';
      x2.addEventListener('click', function () { pending.fileText = ''; pending.fileName = ''; renderChips(); });
      c2.appendChild(x2);
      box.appendChild(c2);
    }
  }

  function clearPending() {
    pending = { img: '', fileName: '', fileText: '' };
    renderChips();
  }

  $('plus').addEventListener('click', function () { $('attachmenu').classList.toggle('on'); });
  $('pickimg').addEventListener('click', function () { $('attachmenu').classList.remove('on'); $('fileimg').click(); });
  $('pickfile').addEventListener('click', function () { $('attachmenu').classList.remove('on'); $('filetxt').click(); });

  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var raw = e.target.result;
      var img = new Image();
      img.onload = function () {
        var max = 900;
        var w = img.width, h = img.height;
        if (w > max || h > max) {
          var r = Math.min(max / w, max / h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL('image/jpeg', 0.8)); } catch (err) { cb(raw); }
      };
      img.onerror = function () { cb(raw); };
      img.src = raw;
    };
    reader.readAsDataURL(file);
  }

  $('fileimg').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    compressImage(f, function (dataUrl) {
      pending.img = dataUrl;
      renderChips();
      toast('图挂上了，发出去就走识图那条');
    });
    e.target.value = '';
  });

  $('filetxt').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      pending.fileText = String(r.result || '');
      pending.fileName = f.name;
      renderChips();
      toast('文件读进来了');
    };
    r.onerror = function () { toast('文件读不了'); };
    r.readAsText(f);
    e.target.value = '';
  });

  var pendingCat = 'identity';

  function renderMemCats() {
    var box = $('memcats');
    box.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'btn' + (pendingCat === c.id ? ' solid' : '');
      b.textContent = c.name;
      b.addEventListener('click', function () { pendingCat = c.id; renderMemCats(); });
      box.appendChild(b);
    });
  }

  function renderMem() {
    var box = $('memlist');
    box.innerHTML = '';
    if (!mem.length) {
      var p = document.createElement('p');
      p.className = 'hint';
      p.textContent = '还没有。';
      box.appendChild(p);
      renderMemCats();
      return;
    }
    CATS.forEach(function (cat) {
      var rows = [];
      mem.forEach(function (m, i) { if ((m.cat || 'identity') === cat.id) rows.push({ m: m, i: i }); });
      if (!rows.length) return;
      var h = document.createElement('div');
      h.className = 'cat';
      h.textContent = cat.name;
      box.appendChild(h);
      rows.forEach(function (r) {
        var d = document.createElement('div');
        d.className = 'item';
        var t = document.createElement('div');
        t.className = 'txt';
        t.textContent = (r.i + 1) + '. ' + r.m.text;
        var acts = document.createElement('div');
        acts.className = 'acts';
        var del = document.createElement('button');
        del.textContent = '删';
        del.addEventListener('click', function () {
          mem.splice(r.i, 1);
          save(LS.mem, mem);
          renderMem();
        });
        acts.appendChild(del);
        d.appendChild(t);
        d.appendChild(acts);
        box.appendChild(d);
      });
    });
    renderMemCats();
  }

  $('memadd').addEventListener('click', function () {
    var v = $('memtext').value.trim();
    if (!v) return;
    mem.push({ cat: pendingCat, text: v });
    save(LS.mem, mem);
    $('memtext').value = '';
    renderMem();
    toast('加上了');
  });

  $('memexport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(mem, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'memory.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  });

  $('memimport').addEventListener('click', function () { $('memfile').click(); });

  $('memfile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var arr = JSON.parse(r.result);
        if (!Array.isArray(arr)) throw new Error('bad');
        arr.forEach(function (x) {
          if (typeof x === 'string' && x.trim()) mem.push({ cat: 'identity', text: x.trim() });
          else if (x && x.text) mem.push({ cat: x.cat || x.kind || 'identity', text: String(x.text).trim() });
        });
        save(LS.mem, mem);
        renderMem();
        toast('导入了 ' + arr.length + ' 条');
      } catch (err) { toast('文件读不了'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });

  function renderWb() {
    var box = $('wblist');
    box.innerHTML = '';
    if (!wb.length) {
      var p = document.createElement('p');
      p.className = 'hint';
      p.textContent = '还没有。';
      box.appendChild(p);
      return;
    }
    wb.forEach(function (e, i) {
      var d = document.createElement('div');
      d.className = 'item';
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = (e.on === false ? '（关）' : '') + (e.keys || '(没关键词)') + ' — ' + String(e.content || '').slice(0, 40);
      var acts = document.createElement('div');
      acts.className = 'acts';
      var tg = document.createElement('button');
      tg.textContent = e.on === false ? '开' : '关';
      tg.addEventListener('click', function () { wb[i].on = (e.on === false); save(LS.wb, wb); renderWb(); });
      var del = document.createElement('button');
      del.textContent = '删';
      del.addEventListener('click', function () { wb.splice(i, 1); save(LS.wb, wb); renderWb(); });
      acts.appendChild(tg);
      acts.appendChild(del);
      d.appendChild(t);
      d.appendChild(acts);
      box.appendChild(d);
    });
  }

  $('wbadd').addEventListener('click', function () {
    var k = $('wbkeys').value.trim();
    var c = $('wbtext').value.trim();
    if (!k || !c) { toast('关键词和内容都要填'); return; }
    wb.push({ keys: k, content: c, on: true });
    save(LS.wb, wb);
    $('wbkeys').value = '';
    $('wbtext').value = '';
    renderWb();
    toast('加上了');
  });

  function renderRx() {
    var box = $('rxlist');
    box.innerHTML = '';
    if (!rx.length) {
      var p = document.createElement('p');
      p.className = 'hint';
      p.textContent = '还没有。';
      box.appendChild(p);
      return;
    }
    rx.forEach(function (r, i) {
      var d = document.createElement('div');
      d.className = 'item';
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = (r.on === false ? '（关）' : '') + '/' + r.from + '/ → ' + (r.to || '(空)');
      var acts = document.createElement('div');
      acts.className = 'acts';
      var tg = document.createElement('button');
      tg.textContent = r.on === false ? '开' : '关';
      tg.addEventListener('click', function () { rx[i].on = (r.on === false); save(LS.rx, rx); renderRx(); });
      var del = document.createElement('button');
      del.textContent = '删';
      del.addEventListener('click', function () { rx.splice(i, 1); save(LS.rx, rx); renderRx(); });
      acts.appendChild(tg);
      acts.appendChild(del);
      d.appendChild(t);
      d.appendChild(acts);
      box.appendChild(d);
    });
  }

  $('rxadd').addEventListener('click', function () {
    var f = $('rxfrom').value.trim();
    if (!f) { toast('要填匹配的规则'); return; }
    try { new RegExp(f); } catch (e) { toast('这个正则不合法'); return; }
    rx.push({ from: f, to: $('rxto').value, on: true });
    save(LS.rx, rx);
    $('rxfrom').value = '';
    $('rxto').value = '';
    renderRx();
    toast('加上了');
  });

  function fillSettings() {
    $('s-url').value = cfg.url || '';
    $('s-key').value = cfg.key || '';
    $('s-model').value = cfg.model || '';
    $('s-vurl').value = cfg.vUrl || '';
    $('s-vkey').value = cfg.vKey || '';
    $('s-vmodel').value = cfg.vModel || '';
    $('s-sys').value = cfg.sys || DEFAULT_SYS;
    renderWb();
    renderRx();
  }

  function collectSettings() {
    cfg = {
      url: $('s-url').value.trim() || DEFAULT_URL,
      key: $('s-key').value.trim(),
      model: $('s-model').value.trim() || 'deepseek-chat',
      vUrl: $('s-vurl').value.trim(),
      vKey: $('s-vkey').value.trim(),
      vModel: $('s-vmodel').value.trim(),
      sys: DEFAULT_SYS,
      sysVer: SYS_VERSION
    };
    save(LS.cfg, cfg);
  }

  $('save').addEventListener('click', function () { collectSettings(); toast('存好了'); });
  $('reload').addEventListener('click', function () { location.href = location.pathname + '?t=' + Date.now(); });
  $('brand').addEventListener('dblclick', function () { location.href = location.pathname + '?t=' + Date.now(); });

  $('clear').addEventListener('click', function () {
    if (!confirm('清空这个窗口？其他窗口和记忆都不动。')) return;
    history = [];
    total = 0;
    pushSession();
    renderChat();
    showPage('chat');
    toast('清空了');
  });

  $('test').addEventListener('click', async function () {
    collectSettings();
    if (!cfg.key) { toast('先填密钥'); return; }
    toast('试呢');
    try {
      var res = await fetch(cfg.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
        body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: '你好' }], max_tokens: 10 })
      });
      if (!res.ok) {
        var t = '';
        try { t = (await res.text()).slice(0, 120); } catch (e) {}
        toast('不通：HTTP ' + res.status + ' ' + t);
        return;
      }
      var j = await res.json();
      var reply = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
      toast('通了 · ' + reply.slice(0, 30));
    } catch (err) { toast('连不上：' + err.message); }
  });

  var TINY_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAG0lEQVQ4jWNgYGD4z0AcYPgPBIwMjP8ZGBgYGBgAAB0hBf8AAAAASUVORK5CYII=';

  $('vtest').addEventListener('click', async function () {
    collectSettings();
    if (!cfg.key) { toast('先填密钥'); return; }
    if (!cfg.vModel) { toast('先填识图模型的名字'); return; }
    var route = { url: cfg.vUrl || cfg.url, key: cfg.vKey || cfg.key, model: cfg.vModel };
    toast('试呢');
    try {
      var res = await fetch(route.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + route.key },
        body: JSON.stringify({
          model: route.model,
          max_tokens: 20,
          messages: [{
            role: 'user',
            content: [
              { type: 'text', text: '看到图了吗？看到就回一个字：看到' },
              { type: 'image_url', image_url: { url: TINY_PNG } }
            ]
          }]
        })
      });
      if (!res.ok) {
        var t = '';
        try { t = (await res.text()).slice(0, 150); } catch (e) {}
        toast('不通：HTTP ' + res.status + ' ' + t);
        return;
      }
      var j = await res.json();
      var reply = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
      toast('通 · ' + String(reply).slice(0, 30));
    } catch (err) { toast('连不上：' + err.message); }
  });

  showPage('chat');
  renderChat();
  fillSettings();
  renderMem();
  renderWins();
  renderChips();
  autoGrow();

  if (!cfg.key) setTimeout(function () { toast('先去设置里填接口和密钥'); }, 500);
})();
</script>
</body>
</html>
